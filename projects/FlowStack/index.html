<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowstack — Where your team's work finally clicks</title>
    <meta
      name="description"
      content="Flowstack is project and team management for startups and small teams: boards, timelines, chat, automations and analytics in one fast workspace."
    />
    <meta name="author" content="Flowstack" />
    <meta property="og:title" content="Flowstack — Where your team's work finally clicks" />
    <meta property="og:description" content="Boards, timelines, chat and automations in one fast workspace built for small teams." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <style>
      :root {
        --radius: 1rem;
        --lime: oklch(0.88 0.23 128);
        --violet: oklch(0.55 0.2 290);
        --bg: oklch(0.15 0.065 285);
        --fg: oklch(0.97 0.01 285);
        --surface: oklch(0.21 0.06 285);
        --surface-2: oklch(0.26 0.06 286);
        --muted-fg: oklch(0.74 0.03 286);
        --primary: var(--lime);
        --primary-fg: oklch(0.18 0.07 285);
        --border: oklch(1 0 0 / 12%);
        --gradient-hero:
          radial-gradient(60% 55% at 18% 8%, oklch(0.45 0.19 292 / 0.55) 0%, transparent 60%),
          radial-gradient(45% 45% at 88% 18%, oklch(0.7 0.19 190 / 0.28) 0%, transparent 65%),
          radial-gradient(50% 50% at 70% 90%, oklch(0.85 0.22 128 / 0.18) 0%, transparent 60%);
        --shadow-card: 0 30px 70px -40px oklch(0 0 0 / 0.9);
        --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        --maxw: 1280px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        border-color: var(--border);
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: var(--display);
        letter-spacing: -0.035em;
        margin: 0;
        line-height: 0.95;
      }
      p {
        margin: 0;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      ::selection {
        background: var(--lime);
        color: var(--primary-fg);
      }

      /* ---------- helpers ---------- */
      .wrap {
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 0 20px;
      }
      .narrow {
        max-width: 900px;
        margin: 0 auto;
        text-align: center;
      }
      .muted {
        color: var(--muted-fg);
      }
      .eyebrow {
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--primary);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        background: color-mix(in oklab, var(--surface) 55%, transparent);
        backdrop-filter: blur(12px);
        border-radius: 999px;
        padding: 7px 16px;
        font-size: 0.75rem;
        color: var(--muted-fg);
      }
      .mesh {
        background-image: var(--gradient-hero);
        background-size: 180% 180%;
        animation: mesh-drift 22s ease-in-out infinite;
      }
      .glass {
        background: color-mix(in oklab, var(--surface) 55%, transparent);
        backdrop-filter: blur(18px) saturate(140%);
        border: 1px solid oklch(1 0 0 / 0.1);
        box-shadow: var(--shadow-card);
      }
      .glass-hover {
        transition:
          transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.35s ease,
          border-color 0.35s ease;
      }
      .glass-hover:hover {
        transform: translateY(-6px);
        border-color: color-mix(in oklab, var(--lime) 45%, transparent);
        box-shadow:
          var(--shadow-card),
          0 0 0 1px color-mix(in oklab, var(--lime) 20%, transparent),
          0 22px 60px -30px color-mix(in oklab, var(--lime) 55%, transparent);
      }
      .grad-text {
        background: linear-gradient(
          100deg,
          oklch(0.99 0.01 285) 0%,
          oklch(0.93 0.16 128) 55%,
          oklch(0.85 0.1 190) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }
      .float-slow {
        animation: floaty 9s ease-in-out infinite;
      }
      .float-slower {
        animation: floaty 13s ease-in-out infinite;
      }
      @keyframes mesh-drift {
        0%,
        100% {
          background-position: 0% 0%, 100% 0%, 50% 100%;
        }
        50% {
          background-position: 30% 25%, 70% 30%, 20% 70%;
        }
      }
      @keyframes floaty {
        0%,
        100% {
          transform: translateY(0) rotate(var(--tilt, 0deg));
        }
        50% {
          transform: translateY(-16px) rotate(var(--tilt, 0deg));
        }
      }
      @keyframes ping {
        75%,
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      @keyframes bounce {
        0%,
        100% {
          transform: translateY(-25%);
        }
        50% {
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
        .reveal {
          opacity: 1;
          transform: none;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 999px;
        padding: 16px 32px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
        transition: transform 0.3s ease, border-color 0.3s, color 0.3s;
      }
      .btn:hover {
        transform: translateY(-3px);
      }
      .btn-primary {
        background: var(--primary);
        color: var(--primary-fg);
        box-shadow: 0 24px 70px -24px var(--lime);
      }
      .btn-ghost {
        border-color: var(--border);
        background: color-mix(in oklab, var(--surface) 50%, transparent);
        backdrop-filter: blur(12px);
        color: var(--fg);
      }
      .btn-ghost:hover {
        border-color: color-mix(in oklab, var(--lime) 50%, transparent);
        color: var(--primary);
      }
      .icon {
        width: 1em;
        height: 1em;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }

      /* ---------- nav ---------- */
      header.nav {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 50;
        transition: backdrop-filter 0.3s;
      }
      header.nav.scrolled {
        backdrop-filter: blur(20px);
      }
      .nav-inner {
        max-width: var(--maxw);
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 20px;
        transition: background 0.3s, border-color 0.3s;
        border-bottom: 1px solid transparent;
      }
      header.nav.scrolled .nav-inner {
        border-bottom-color: var(--border);
        background: color-mix(in oklab, var(--bg) 70%, transparent);
      }
      .wordmark {
        font-family: var(--display);
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.06em;
      }
      .wordmark span {
        color: var(--primary);
      }
      .wordmark i {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--primary);
        margin-left: 3px;
        vertical-align: middle;
      }
      .nav-links {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .nav-links a {
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 0.875rem;
        color: var(--muted-fg);
        transition: background 0.2s, color 0.2s;
      }
      .nav-links a:hover,
      .nav-links a.active {
        color: var(--fg);
        background: color-mix(in oklab, var(--surface-2) 60%, transparent);
      }
      .nav-cta {
        margin-left: 12px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-fg) !important;
        padding: 10px 20px !important;
        font-weight: 600;
        box-shadow: 0 10px 40px -12px var(--lime);
      }
      .burger {
        margin-left: auto;
        display: none;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .mobile-menu {
        display: none;
        margin: 0 16px 8px;
        border-radius: 24px;
        border: 1px solid var(--border);
        background: color-mix(in oklab, var(--bg) 95%, transparent);
        backdrop-filter: blur(20px);
        padding: 12px;
      }
      .mobile-menu a {
        display: block;
        border-radius: 16px;
        padding: 12px 16px;
        font-size: 0.875rem;
        color: var(--muted-fg);
      }
      .mobile-menu a.cta {
        margin-top: 8px;
        background: var(--primary);
        color: var(--primary-fg);
        text-align: center;
        font-weight: 600;
      }
      @media (max-width: 860px) {
        .nav-links {
          display: none;
        }
        .burger {
          display: grid;
        }
        .mobile-menu.open {
          display: block;
        }
      }

      /* ---------- sections ---------- */
      section {
        padding: 96px 0;
      }
      .hero {
        position: relative;
        overflow: hidden;
        padding: 150px 0 120px;
      }
      .hero-grid {
        display: grid;
        gap: 64px;
        align-items: center;
      }
      @media (min-width: 1024px) {
        .hero-grid {
          grid-template-columns: 1.05fr 0.95fr;
          gap: 40px;
        }
      }
      .hero-lines {
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0.28;
        background-image:
          linear-gradient(to right, oklch(1 0 0 / 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, oklch(1 0 0 / 0.07) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(70% 60% at 50% 30%, black, transparent);
        mask-image: radial-gradient(70% 60% at 50% 30%, black, transparent);
        pointer-events: none;
      }
      h1.hero-title {
        margin-top: 28px;
        font-size: clamp(3rem, 8.2vw, 6.25rem);
        line-height: 0.88;
        letter-spacing: -0.045em;
        font-weight: 800;
      }
      .hero p.lede {
        margin-top: 32px;
        max-width: 36rem;
        font-size: clamp(1.05rem, 2vw, 1.25rem);
        line-height: 1.6;
        color: var(--muted-fg);
      }
      .hero-actions {
        margin-top: 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .page-hero {
        position: relative;
        overflow: hidden;
        padding: 160px 0 72px;
      }
      .page-hero h1 {
        margin-top: 24px;
        font-size: clamp(2.5rem, 7vw, 4.75rem);
        font-weight: 800;
      }
      .page-hero p {
        margin: 28px auto 0;
        max-width: 40rem;
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--muted-fg);
      }
      h2.section-title {
        font-size: clamp(2.25rem, 5.5vw, 3.75rem);
        font-weight: 800;
      }

      .grid {
        display: grid;
        gap: 20px;
      }
      .cols-3 {
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .cols-4 {
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .cols-5 {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
      .card {
        border-radius: 28px;
        padding: 28px;
        height: 100%;
      }

      /* trust strip */
      .trust {
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 48px 0;
      }
      .logos {
        margin-top: 32px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 24px;
      }
      .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        opacity: 0.45;
        filter: grayscale(1);
        transition: opacity 0.3s;
      }
      .logo:hover {
        opacity: 0.9;
      }
      .logo b {
        font-family: var(--display);
        font-size: 1rem;
      }
      .logo em {
        width: 16px;
        height: 16px;
        border: 2px solid var(--fg);
        display: block;
      }

      /* bento */
      .bento {
        margin-top: 56px;
        display: grid;
        gap: 20px;
      }
      @media (min-width: 1024px) {
        .bento {
          grid-template-columns: repeat(6, 1fr);
        }
        .sp3 {
          grid-column: span 3;
        }
        .sp2 {
          grid-column: span 2;
        }
        .sp1 {
          grid-column: span 1;
        }
        .sp4 {
          grid-column: span 4;
        }
      }
      .bento .card {
        position: relative;
        overflow: hidden;
        border-radius: 28px;
      }
      .bento .glow {
        position: absolute;
        top: -96px;
        right: -96px;
        width: 224px;
        height: 224px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--lime) 8%, transparent);
        filter: blur(60px);
      }
      .ibox {
        position: relative;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 16px;
        background: color-mix(in oklab, var(--lime) 12%, transparent);
        color: var(--primary);
        font-size: 20px;
      }
      .bento h3 {
        position: relative;
        margin-top: 20px;
        font-size: 1.25rem;
        font-weight: 700;
      }
      .bento p {
        position: relative;
        margin-top: 8px;
        max-width: 24rem;
        font-size: 0.875rem;
        line-height: 1.6;
        color: var(--muted-fg);
      }

      .stat-num {
        font-family: var(--display);
        font-size: clamp(2.5rem, 5vw, 3.5rem);
        font-weight: 800;
        color: var(--primary);
        line-height: 1;
      }

      figure.quote {
        display: flex;
        flex-direction: column;
        margin: 0;
        border-radius: 28px;
        padding: 32px;
        height: 100%;
      }
      figure.quote blockquote {
        margin: 20px 0 0;
        flex: 1;
        font-size: 15px;
        line-height: 1.7;
        color: color-mix(in oklab, var(--fg) 90%, transparent);
      }
      figcaption {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-top: 1px solid var(--border);
        padding-top: 24px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--bg);
      }

      .cta-band {
        position: relative;
        overflow: hidden;
        border-radius: 40px;
        border: 1px solid var(--border);
        padding: 80px 24px;
        text-align: center;
      }
      .cta-band h2 {
        margin: 0 auto;
        max-width: 48rem;
        font-size: clamp(2.25rem, 6vw, 4rem);
        font-weight: 800;
      }
      .cta-band .blob {
        position: absolute;
        left: 25%;
        right: 25%;
        bottom: -160px;
        height: 256px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--lime) 20%, transparent);
        filter: blur(100px);
      }

      /* product alternating rows */
      .prow {
        display: grid;
        gap: 40px;
        align-items: center;
        margin: 0 auto 128px;
        max-width: 1120px;
      }
      @media (min-width: 1024px) {
        .prow {
          grid-template-columns: 1fr 1fr;
        }
        .prow.flip > *:first-child {
          order: 2;
        }
      }
      .prow h2 {
        margin-top: 16px;
        font-size: clamp(1.9rem, 4vw, 2.9rem);
        line-height: 1.02;
        font-weight: 800;
      }
      .bullets {
        margin-top: 28px;
        display: grid;
        gap: 12px;
      }
      .bullets li {
        display: flex;
        gap: 12px;
        font-size: 0.875rem;
        color: var(--muted-fg);
      }
      .tick {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        flex: none;
        border-radius: 999px;
        background: color-mix(in oklab, var(--lime) 15%, transparent);
        color: var(--primary);
        font-size: 12px;
      }

      /* pricing */
      .plan {
        position: relative;
        border-radius: 32px;
        padding: 32px;
        height: 100%;
      }
      .plan.featured {
        border-color: color-mix(in oklab, var(--lime) 45%, transparent);
        box-shadow: var(--shadow-card), 0 0 0 1px color-mix(in oklab, var(--lime) 25%, transparent);
      }
      .plan .badge {
        position: absolute;
        top: -12px;
        left: 32px;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-fg);
        padding: 4px 12px;
        font-size: 11px;
        font-weight: 700;
      }
      .price {
        font-family: var(--display);
        font-size: 3rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      .plan-cta {
        margin-top: 32px;
        display: block;
        border-radius: 18px;
        padding: 14px 24px;
        text-align: center;
        font-size: 0.875rem;
        font-weight: 600;
        transition: transform 0.3s;
      }
      .plan-cta:hover {
        transform: translateY(-2px);
      }
      .plan-cta.solid {
        background: var(--primary);
        color: var(--primary-fg);
        box-shadow: 0 20px 50px -22px var(--lime);
      }
      .plan-cta.outline {
        border: 1px solid var(--border);
        background: color-mix(in oklab, var(--surface-2) 60%, transparent);
      }

      /* contact */
      .contact-grid {
        display: grid;
        gap: 24px;
      }
      @media (min-width: 1024px) {
        .contact-grid {
          grid-template-columns: 1.1fr 0.9fr;
        }
      }
      label.f {
        display: block;
        margin-bottom: 8px;
        font-size: 0.75rem;
        color: var(--muted-fg);
      }
      .field {
        width: 100%;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: color-mix(in oklab, var(--bg) 50%, transparent);
        padding: 12px 16px;
        font-size: 0.875rem;
        font-family: inherit;
        color: var(--fg);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .field::placeholder {
        color: color-mix(in oklab, var(--muted-fg) 70%, transparent);
      }
      .field:focus {
        border-color: color-mix(in oklab, var(--lime) 70%, transparent);
        box-shadow: 0 0 0 3px color-mix(in oklab, var(--lime) 25%, transparent);
      }
      .cal {
        margin-top: 20px;
        border-radius: 18px;
        background: color-mix(in oklab, var(--bg) 40%, transparent);
        padding: 16px;
      }
      .cal-days,
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
        text-align: center;
      }
      .cal-grid span {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 10px;
        font-size: 11px;
        color: color-mix(in oklab, var(--muted-fg) 55%, transparent);
      }
      .cal-grid span.open {
        background: color-mix(in oklab, var(--surface-2) 80%, transparent);
        color: var(--fg);
      }
      .cal-grid span.active {
        background: var(--primary);
        color: var(--primary-fg);
        font-weight: 700;
      }
      .slots {
        margin-top: 16px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .slots span {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        font-size: 12px;
        color: var(--muted-fg);
      }
      .slots span.sel {
        border-color: color-mix(in oklab, var(--lime) 70%, transparent);
        background: color-mix(in oklab, var(--lime) 15%, transparent);
        color: var(--primary);
        font-weight: 600;
      }
      .map {
        position: relative;
        margin-top: 24px;
        height: 176px;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: color-mix(in oklab, var(--bg) 50%, transparent);
      }
      .map .road-h {
        position: absolute;
        top: 42%;
        left: 38%;
        width: 55%;
        height: 6px;
        border-radius: 999px;
        background: oklch(1 0 0 / 0.12);
      }
      .map .road-v {
        position: absolute;
        top: 30%;
        left: 20%;
        width: 6px;
        height: 45%;
        border-radius: 999px;
        background: oklch(1 0 0 / 0.12);
      }

        var io = new IntersectionObserver(

                io.unobserve(e.target);
              }
            });

        function countUp(el) {
          var to = parseFloat(el.dataset.count),

            suffix = el.dataset.suffix || "",
            start = null,
            dur = 1600;
          function step(ts) {
            if (!start) start = ts;
            var p = Math.min((ts - start) / dur, 1);
            var eased = 1 - Math.pow(1 - p, 3);
            var val = to * eased;
            el.textContent =
              (val >= 1000 ? Math.round(val).toLocaleString() : val.toFixed(dec)) + suffix;
            if (p < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }

            entries.forEach(function (e) {

            app.innerHTML = page.render();
